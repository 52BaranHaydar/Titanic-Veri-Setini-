<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Titanic Hayatta Kalma Tahmincisi</title>
  <meta name="description" content="Yapay sinir ağı ile Titanic hayatta kalma olasılığını tahmin edin." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- Arka plan yıldızları -->
  <div class="stars" id="stars"></div>

  <!-- Dalga animasyonu -->
  <div class="wave-wrapper">
    <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path d="M0,64 C360,120 1080,0 1440,64 L1440,120 L0,120 Z" fill="rgba(10,14,40,0.9)" />
    </svg>
  </div>

  <div class="container">

    <!-- HEADER -->
    <header class="header">
      <div class="ship-icon">🚢</div>
      <h1>Titanic <span class="gradient-text">Hayatta Kalma</span> Tahmincisi</h1>
      <p class="subtitle">Yolcu bilgilerini gir, yapay sinir ağı hayatta kalıp kalmayacağını tahmin etsin</p>
    </header>

    <!-- FORM KARTI -->
    <div class="card" id="formCard">
      <form id="predForm" novalidate>

        <div class="form-grid">

          <!-- Yolcu Sınıfı -->
          <div class="field" id="field-pclass">
            <label for="pclass">🎫 Yolcu Sınıfı</label>
            <select id="pclass" name="pclass" required>
              <option value="">Seçin…</option>
              <option value="1">1. Sınıf — First Class 👑</option>
              <option value="2">2. Sınıf — Second Class 🎩</option>
              <option value="3">3. Sınıf — Third Class 🧳</option>
            </select>
          </div>

          <!-- Cinsiyet -->
          <div class="field" id="field-sex">
            <label>⚧ Cinsiyet</label>
            <div class="toggle-group">
              <label class="toggle-opt">
                <input type="radio" name="sex" value="0" id="sex-male" required />
                <span>♂ Erkek</span>
              </label>
              <label class="toggle-opt">
                <input type="radio" name="sex" value="1" id="sex-female" />
                <span>♀ Kadın</span>
              </label>
            </div>
          </div>

          <!-- Yaş -->
          <div class="field" id="field-age">
            <label for="age">🎂 Yaş</label>
            <input type="number" id="age" name="age" min="0.1" max="120" step="0.5" placeholder="Örn: 28" required />
          </div>

          <!-- Bilet Ücreti -->
          <div class="field" id="field-fare">
            <label for="fare">💰 Bilet Ücreti ($)</label>
            <input type="number" id="fare" name="fare" min="0" step="0.01" placeholder="Örn: 32.50" required />
          </div>

          <!-- Kardeş/Eş -->
          <div class="field" id="field-sibsp">
            <label for="sibsp">👫 Kardeş / Eş Sayısı</label>
            <input type="number" id="sibsp" name="sibsp" min="0" max="10" value="0" required />
          </div>

          <!-- Ebeveyn/Çocuk -->
          <div class="field" id="field-parch">
            <label for="parch">👨‍👧 Ebeveyn / Çocuk Sayısı</label>
            <input type="number" id="parch" name="parch" min="0" max="10" value="0" required />
          </div>

          <!-- Biniş Limanı (full-width) -->
          <div class="field full" id="field-embarked">
            <label>⚓ Biniş Limanı</label>
            <div class="port-group">
              <label class="port-opt">
                <input type="radio" name="embarked" value="0" id="emb-s" required />
                <span><strong>S</strong><small>Southampton</small></span>
              </label>
              <label class="port-opt">
                <input type="radio" name="embarked" value="1" id="emb-c" />
                <span><strong>C</strong><small>Cherbourg</small></span>
              </label>
              <label class="port-opt">
                <input type="radio" name="embarked" value="2" id="emb-q" />
                <span><strong>Q</strong><small>Queenstown</small></span>
              </label>
            </div>
          </div>

        </div><!-- /form-grid -->

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="btn-label">Tahmini Hesapla</span>
          <span class="btn-icon">⚡</span>
          <span class="btn-spinner hidden" id="spinner">⏳</span>
        </button>

      </form>
    </div><!-- /card -->

    <!-- SONUÇ KARTI -->
    <div class="result-card hidden" id="resultCard">
      <div class="result-icon" id="resultIcon"></div>
      <h2 class="result-title" id="resultTitle"></h2>
      <p class="result-sub" id="resultSub"></p>

      <div class="prob-container">
        <div class="prob-labels">
          <span>Hayatta kalamaz</span>
          <span>Hayatta kalır</span>
        </div>
        <div class="prob-bar-track">
          <div class="prob-bar-fill" id="probFill"></div>
        </div>
        <div class="prob-pct" id="probPct"></div>
      </div>

      <button class="retry-btn" id="retryBtn">← Tekrar Dene</button>
    </div>

  </div><!-- /container -->

  <script src="/static/script.js"></script>
</body>
</html>
